<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Gilco Patio Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f8f9;--panel:#fff;--ink:#1d2329;--muted:#5d6872;--line:#d3d8dd;--bronze:#8a5a2b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px;display:grid;gap:14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--bronze);margin-inline:-16px;padding:10px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:600;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}h1{font-size:26px;line-height:1.1}h2{font-size:19px}
.hint{margin:0;color:var(--muted);font-size:14px}
</style>
</head><body>
<div class="wrap">
  <header><div class="brand">Gilco Construction<small>Aluminum Patio Covers</small></div></header>
  <section class="panel" id="top"><p class="hint">Loading…</p></section>
  <section class="panel" id="box" hidden></section>
  <section class="panel" id="spot" hidden></section>
</div>
<script src="photos.js?v=6"></script>
<script>
(async()=>{
  const t=new URLSearchParams(location.search).get("q")||"", top=document.getElementById("top"), box=document.getElementById("box");
  if(!/^[0-9a-f-]{36}$/i.test(t)){top.innerHTML=`<h1>Link not found</h1><p class="hint">This photo link isn't valid. Call Gilco Construction for a new one.</p>`;return}
  try{
    const r=await GilcoPhotos.rpc("pc_quote_get",{p_token:t});
    if(r.state!=="ok"){top.innerHTML=`<h1>Link not found</h1><p class="hint">This photo link isn't valid. Call Gilco Construction for a new one.</p>`;return}
    top.innerHTML=`<h1>Photos for your patio cover${r.name?", "+r.name.replace(/[<>&"]/g,""):""}</h1>
      <p class="hint">Quote ${r.quote_no}. We need 4 photos of the area where the cover goes, plus 1 of the front of your house so our installer finds the right home.${r.deposit?' Then show us where to leave the materials.':''} Tap a box to take or choose a photo.</p>`;
    box.hidden=false;GilcoPhotos.mount(box,t,r.photos||{},{title:false,showLink:false});
    if(r.deposit){const sb=document.getElementById("spot");sb.hidden=false;GilcoPhotos.mountSpot(sb,t,r.addr||"",r.spot)}
  }catch(e){top.innerHTML=`<h1>Can't load right now</h1><p class="hint">Check your signal and reload this page.</p>`}
})();
</script>
</body></html>
